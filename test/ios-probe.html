<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>iOS audio API probe</title>
<style>body{font:28px/1.5 monospace;padding:1rem}b{color:#080}i{color:#c00;font-style:normal}</style>
</head><body>
<div id="out">running…</div>
<script>
  const r = {};
  r.audioSession_supported = (typeof navigator.audioSession !== 'undefined');
  r.audioSession_type_before = r.audioSession_supported ? navigator.audioSession.type : 'n/a';
  try {
    if (r.audioSession_supported) navigator.audioSession.type = 'playback';
    r.set_playback_threw = false;
  } catch (e) { r.set_playback_threw = String(e); }
  r.audioSession_type_after = r.audioSession_supported ? navigator.audioSession.type : 'n/a';
  r.AudioContext = (typeof (window.AudioContext || window.webkitAudioContext) !== 'undefined');
  r.DecompressionStream = (typeof DecompressionStream !== 'undefined');
  document.getElementById('out').innerHTML = Object.entries(r)
    .map(([k, v]) => `${k} = <${v === true ? 'b' : (v === false || String(v).includes('Error') ? 'i' : 'span')}>${v}</${v === true ? 'b' : (v === false || String(v).includes('Error') ? 'i' : 'span')}>`)
    .join('<br>');
</script>
</body></html>
